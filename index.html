<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rama's Kitchen</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#17202a;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--green:#15803d;--red:#b91c1c}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--accent);color:#fff;padding:18px 16px 16px;position:sticky;top:0;z-index:5}
h1{margin:0;font-size:22px} .date{font-size:13px;opacity:.8;margin-top:4px}
.wrap{max-width:760px;margin:auto;padding:14px}
.summary{display:flex;gap:10px;margin-bottom:12px} .stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px} .stat span{font-size:12px;color:var(--muted)}
.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:15px;margin-bottom:12px}
.order{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:10px} .flat{font-size:17px;font-weight:750} .time,.note{font-size:12px;color:var(--muted);margin-top:4px}
.items{margin-top:9px;line-height:1.55} .badge{font-size:11px;padding:4px 7px;border-radius:99px;background:#fef3c7;color:#92400e;white-space:nowrap}
.actions{display:flex;gap:8px;margin-top:10px} button{border:0;border-radius:10px;padding:9px 12px;font-weight:650;cursor:pointer} .done{background:#dcfce7;color:var(--green)} .del{background:#fee2e2;color:var(--red)}
section{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;margin-top:16px;margin-bottom:90px}
h2{font-size:17px;margin:0 0 10px} .total{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line)} .total:first-child{border-top:0}
.fab{position:fixed;right:18px;bottom:18px;width:56px;height:56px;border-radius:50%;font-size:28px;background:#111827;color:#fff;box-shadow:0 8px 24px #0002}
.empty{text-align:center;color:var(--muted);padding:25px}
.modal{display:none;position:fixed;inset:0;background:#0007;z-index:10;padding:18px;overflow:auto} .modal.show{display:block}
.dialog{max-width:600px;margin:35px auto;background:#fff;border-radius:18px;padding:16px}
input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;margin:6px 0 10px;font-size:15px}
.itemline{display:grid;grid-template-columns:1fr 80px 42px;gap:7px;align-items:center} .itemline button{padding:9px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
</style>
</head>
<body>
<header><h1>🍱 Rama's Kitchen</h1><div class="date" id="date"></div></header>
<main class="wrap">
<div class="summary"><div class="stat"><b id="orderCount">0</b><span>Orders</span></div><div class="stat"><b id="itemCount">0</b><span>Total Items</span></div></div>
<input class="search" id="search" placeholder="Search flat number...">
<div id="orders"></div>
<section><h2>Item Totals</h2><div id="totals"></div></section>
</main>
<button class="fab" id="addBtn">+</button>
<div class="modal" id="modal"><div class="dialog">
<h2 id="modalTitle">Add Order</h2>
<label>Flat number</label><input id="flat" placeholder="B2 1006">
<label>Items</label><div id="itemRows"></div>
<button id="addItem">+ Add item</button>
<div class="modal-actions"><button id="cancel">Cancel</button><button id="save" style="background:#111827;color:#fff">Save</button></div>
</div></div>
<script>
(() => {
const seed={"app": "Rama's Kitchen", "version": 2, "date": "2026-09-10", "menu": ["Vada Pav", "Paneer Momos", "Veg Momos", "Fried Paneer Momos", "Lemon Soda", "Cold Coffee"], "orders": [{"id": "1001", "date": "2026-09-10", "flat": "B4 1116", "items": [{"name": "Vada Pav", "qty": 1}], "time": "5:45 PM", "status": "pending", "note": ""}, {"id": "1002", "date": "2026-09-10", "flat": "B2 1006", "items": [{"name": "Paneer Momos", "qty": 2}], "time": "", "status": "pending", "note": ""}, {"id": "1003", "date": "2026-09-10", "flat": "B5 519", "items": [{"name": "Veg Momos", "qty": 1}], "time": "5:30 PM", "status": "pending", "note": ""}, {"id": "1004", "date": "2026-09-10", "flat": "B2 307", "items": [{"name": "Veg Momos", "qty": 1}], "time": "5:30 PM", "status": "pending", "note": ""}, {"id": "1005", "date": "2026-09-10", "flat": "B6 1323", "items": [{"name": "Vada Pav", "qty": 3}, {"name": "Fried Paneer Momos", "qty": 1}, {"name": "Lemon Soda", "qty": 1}], "time": "", "status": "pending", "note": ""}, {"id": "1006", "date": "2026-09-10", "flat": "B6 1422", "items": [{"name": "Cold Coffee", "qty": 1}], "time": "", "status": "pending", "note": ""}, {"id": "1007", "date": "2026-09-10", "flat": "B4 915", "items": [{"name": "Vada Pav", "qty": 2}], "time": "5:30 PM", "status": "pending", "note": "Extra chilli if possible 😋"}, {"id": "1008", "date": "2026-09-10", "flat": "B1 301", "items": [{"name": "Veg Momos", "qty": 1}], "time": "5:30 PM", "status": "pending", "note": ""}, {"id": "1009", "date": "2026-09-10", "flat": "B2 905", "items": [{"name": "Paneer Momos", "qty": 1}], "time": "5:30 PM", "status": "pending", "note": ""}, {"id": "1010", "date": "2026-09-10", "flat": "B8 230", "items": [{"name": "Paneer Momos", "qty": 1}], "time": "5:30–6:00 PM", "status": "pending", "note": ""}, {"id": "1011", "date": "2026-09-10", "flat": "B2 806", "items": [{"name": "Veg Momos", "qty": 1}], "time": "6:00 PM", "status": "pending", "note": ""}, {"id": "1012", "date": "2026-09-10", "flat": "B6 1022", "items": [{"name": "Vada Pav", "qty": 2}, {"name": "Veg Momos", "qty": 1}], "time": "", "status": "pending", "note": ""}, {"id": "1013", "date": "2026-09-10", "flat": "B2 1007", "items": [{"name": "Vada Pav", "qty": 1}, {"name": "Veg Momos", "qty": 1}], "time": "", "status": "pending", "note": ""}, {"id": "1014", "date": "2026-09-10", "flat": "B4 014", "items": [{"name": "Vada Pav", "qty": 2}, {"name": "Veg Momos", "qty": 1}], "time": "6:30 PM", "status": "pending", "note": ""}]};
const KEY="ramas_kitchen_orders_v2";
let orders=JSON.parse(localStorage.getItem(KEY)||"null") || seed.orders;
const menu=seed.menu;
let editId=null;

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);
function save(){localStorage.setItem(KEY,JSON.stringify(orders));render();}
function totalsForToday(){
 const t={}; orders.filter(o=>o.date===today()).forEach(o=>(o.items||[]).forEach(i=>t[i.name]=(t[i.name]||0)+(Number(i.qty)||0)));
 return t;
}
function render(){
 const q=$("search").value.trim().toLowerCase();
 const todayOrders=orders.filter(o=>o.date===today()).filter(o=>!q||o.flat.toLowerCase().includes(q));
 $("date").textContent=new Date().toLocaleDateString("en-IN",{day:"2-digit",month:"2-digit",year:"numeric"});
 $("orderCount").textContent=todayOrders.length;
 const t=totalsForToday(); $("itemCount").textContent=Object.values(t).reduce((a,b)=>a+b,0);
 $("orders").innerHTML=todayOrders.length?todayOrders.map(o=>`
  <article class="order">
   <div class="row"><div class="flat">${esc(o.flat)}</div><span class="badge">${o.status==="done"?"Done":"Pending"}</span></div>
   ${o.time?`<div class="time">Time: ${esc(o.time)}</div>`:""}
   <div class="items">${(o.items||[]).map(i=>`${esc(i.name)} × ${i.qty}`).join("<br>")}</div>
   ${o.note?`<div class="note">📝 ${esc(o.note)}</div>`:""}
   <div class="actions"><button class="done" onclick="toggleDone('${o.id}')">${o.status==="done"?"Mark Pending":"Mark Done"}</button><button class="del" onclick="removeOrder('${o.id}')">Delete</button></div>
  </article>`).join(""):`<div class="empty">No orders found.</div>`;
 $("totals").innerHTML=Object.keys(t).length?Object.entries(t).map(([n,v])=>`<div class="total"><span>${esc(n)}</span><b>${v}</b></div>`).join(""):`<div class="empty">No items ordered today.</div>`;
}
function openModal(id=null){
 editId=id; const o=id?orders.find(x=>x.id===id):null; $("modalTitle").textContent=id?"Edit Order":"Add Order"; $("flat").value=o?.flat||""; $("itemRows").innerHTML="";
 (o?.items||[{name:menu[0],qty:1}]).forEach(i=>addRow(i.name,i.qty)); $("modal").classList.add("show");
}
function addRow(name=menu[0],qty=1){
 const d=document.createElement("div"); d.className="itemline";
 d.innerHTML=`<select>${menu.map(x=>`<option ${x===name?"selected":""}>${esc(x)}</option>`).join("")}</select><input type="number" min="1" value="${qty}"><button type="button">×</button>`;
 d.querySelector("button").onclick=()=>d.remove(); $("itemRows").appendChild(d);
}
function closeModal(){$("modal").classList.remove("show");editId=null;}
window.toggleDone=id=>{const o=orders.find(x=>x.id===id);if(o)o.status=o.status==="done"?"pending":"done";save();};
window.removeOrder=id=>{if(confirm("Delete this order?")){orders=orders.filter(o=>o.id!==id);save();}};
$("addBtn").onclick=()=>openModal(); $("cancel").onclick=closeModal; $("search").oninput=render; $("addItem").onclick=()=>addRow();
$("save").onclick=()=>{
 const flat=$("flat").value.trim(); if(!flat){alert("Enter flat number.");return;}
 const items=[...$("itemRows").children].map(r=>({name:r.querySelector("select").value,qty:Number(r.querySelector("input").value)||1}));
 if(!items.length){alert("Add at least one item.");return;}
 if(editId){const o=orders.find(x=>x.id===editId);Object.assign(o,{flat,items});}
 else orders.unshift({id:String(Date.now()),date:today(),flat,items,time:"",status:"pending",note:""});
 save();closeModal();
};
render();
})();
</script>
</body></html>
